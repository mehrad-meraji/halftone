# Publishes to npm with trusted publishing (OIDC): no npm token is stored anywhere.
# npm trusts this file by name. Set it up once at https://www.npmjs.com/package/@_mehrad/halftone/access
# (Trusted Publisher, GitHub Actions: mehrad-meraji / halftone / publish.yml).
#
# Runs when a version tag is pushed (git tag v0.3.0 && git push origin v0.3.0), or by hand for an
# existing tag: gh workflow run publish.yml -f tag=v0.2.0
name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v0.2.0
        required: true

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm publish --provenance --access public
